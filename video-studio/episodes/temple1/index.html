<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
  html, body { margin: 0; width: 1080px; height: 1920px; overflow: hidden; background: #000; }
  canvas { display: block; }
  #vignette { position: absolute; inset: 0; pointer-events: none;
    background: radial-gradient(ellipse at 50% 45%, rgba(0,0,0,0) 45%, rgba(0,0,0,.45) 88%, rgba(0,0,0,.7) 100%); }
  #tint { position: absolute; inset: 0; pointer-events: none; background: #000; opacity: 0; }
  #flash { position: absolute; inset: 0; pointer-events: none; opacity: 0; }
  .txt { position: absolute; left: 60px; right: 60px; text-align: center; color: #fff;
    font-family: 'Inter', sans-serif; font-weight: 900; letter-spacing: -1px;
    -webkit-text-stroke: 12px #000; paint-order: stroke fill; line-height: 1.12; }
  #hook { top: 250px; font-size: 84px; }
  #hook .series { font-size: 88px; letter-spacing: 0px; }
  #cap { top: 1180px; font-size: 104px; text-transform: none; transform-origin: 50% 50%; -webkit-text-stroke: 16px #000; }
  #big { top: 700px; font-size: 104px; color: #fff; }
  #sub { top: 1020px; font-size: 66px; }
</style>
</head>
<body>
<div id="vignette"></div>
<div id="tint"></div>
<div id="flash"></div>
<div id="hook" class="txt"></div>
<div id="cap" class="txt"></div>
<div id="big" class="txt"></div>
<div id="sub" class="txt"></div>
<script type="importmap">{ "imports": {
  "three": "/node_modules/three/build/three.module.js",
  "three/addons/": "/node_modules/three/examples/jsm/"
} }</script>
<script type="module" src="./scene.js"></script>
</body>
</html>
